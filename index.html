<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mapa Uso do Solo - OpenLayers</title>
    
    <!-- OpenLayers CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.4/ol.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0b141a; 
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #dce8f0;
        }
        #map { 
            height: 100vh; 
            width: 100%; 
        }
        
        /* Tela de carregamento */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0b141a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #1a2e3b;
            border-top: 4px solid #58a9e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        #loading p {
            color: #7a9bb3;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .bar {
            width: 300px;
            max-width: 80vw;
            height: 4px;
            background: #1a2e3b;
            border-radius: 4px;
            overflow: hidden;
        }
        .bar-inner {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #58a9e8, #7bc0ff);
            transition: width 0.3s;
        }
        #error-msg {
            color: #ff8a80;
            background: #1e2024;
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #3d2a2a;
            max-width: 500px;
            margin-top: 15px;
            display: none;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
        }
        #error-msg.show { display: block; }
        
        /* Legenda */
        #legend {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(17, 29, 41, 0.95);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #1e3a4d;
            font-size: 12px;
            z-index: 1000;
            max-width: 180px;
            backdrop-filter: blur(4px);
        }
        #legend .title {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .leg-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 3px 0;
        }
        .leg-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .notif {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #111d29;
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #1e3a4d;
            font-size: 13px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }
        .notif.show { opacity: 1; }
        .notif.ok { border-color: #2e7d5e; color: #7bcfa6; }
        .notif.error { border-color: #e53935; color: #ff8a80; }
        
        /* Informações */
        #info {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(17, 29, 41, 0.9);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #1e3a4d;
            font-size: 12px;
            z-index: 1000;
            color: #7a9bb3;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- TELA DE CARREGAMENTO -->
    <div id="loading">
        <div class="spinner"></div>
        <h2 id="load-title">⏳ Carregando Mapa</h2>
        <p id="load-msg">Preparando tudo...</p>
        <div class="bar"><div class="bar-inner" id="load-bar"></div></div>
        <div id="error-msg"></div>
    </div>

    <!-- MAPA -->
    <div id="map"></div>
    
    <!-- INFO -->
    <div id="info">🔄 Carregando GeoTIFF...</div>

    <!-- LEGENDA -->
    <div id="legend">
        <div class="title">📊 Legenda</div>
        <div id="legend-items"></div>
    </div>

    <!-- NOTIFICAÇÃO -->
    <div id="notif" class="notif"></div>

    <!-- ============ BIBLIOTECAS ============ -->
    <!-- OpenLayers -->
    <script src="https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.min.js"></script>
    
    <!-- GeoTIFF.js (para ler o arquivo) -->
    <script src="https://cdn.jsdelivr.net/npm/geotiff@2.0.7/dist/geotiff.bundle.min.js"></script>

    <script>
        // ================================================================
        //  CONFIGURAÇÃO
        // ================================================================
        
        // 🔑 SEU LINK DO DROPBOX
        const DROPBOX_URL = 'https://www.dropbox.com/scl/fi/a62m3wxfw9tzhbvpabg05/UsoOcupacao_Sentinel2.tif?rlkey=nppxevja3hvad638og2byd6tq&dl=1';
        const PROXY_URL = 'https://corsproxy.io/?' + encodeURIComponent(DROPBOX_URL);

        // Classes do mapa
        const CLASSES = [
            { value: 1, label: 'Vegetação Densa', color: '#1b5e20' },
            { value: 2, label: 'Vegetação Aberta', color: '#66bb6a' },
            { value: 3, label: 'Pastagem', color: '#c5e1a5' },
            { value: 4, label: 'Agricultura', color: '#f9a825' },
            { value: 5, label: 'Solo Exposto', color: '#d4a44c' },
            { value: 6, label: 'Área Urbana', color: '#e53935' },
            { value: 7, label: "Corpos d'Água", color: '#1565c0' },
            { value: 8, label: 'Sombra / Nuvem', color: '#607d8b' },
        ];
        const CLASS_MAP = Object.fromEntries(CLASSES.map(c => [c.value, c]));

        // ================================================================
        //  ELEMENTOS DA TELA
        // ================================================================
        
        const loadingEl = document.getElementById('loading');
        const loadTitle = document.getElementById('load-title');
        const loadMsg = document.getElementById('load-msg');
        const loadBar = document.getElementById('load-bar');
        const errorMsg = document.getElementById('error-msg');
        const notifEl = document.getElementById('notif');
        const infoEl = document.getElementById('info');

        function setLoading(title, msg, progress) {
            loadTitle.textContent = title;
            loadMsg.textContent = msg || '';
            if (progress !== undefined) {
                loadBar.style.width = Math.min(100, progress) + '%';
            }
        }

        function showError(msg) {
            errorMsg.innerHTML = msg;
            errorMsg.className = 'show';
            document.querySelector('.spinner').style.display = 'none';
            infoEl.textContent = '❌ Erro ao carregar';
        }

        function showNotif(msg, type) {
            notifEl.textContent = msg;
            notifEl.className = 'notif show ' + (type || '');
            clearTimeout(notifEl._timeout);
            notifEl._timeout = setTimeout(() => {
                notifEl.className = 'notif';
            }, 3000);
        }

        function hideLoading() {
            loadingEl.classList.add('hidden');
            infoEl.textContent = '✅ Mapa pronto';
        }

        // ================================================================
        //  LEGENDA
        // ================================================================
        
        const legendContainer = document.getElementById('legend-items');
        CLASSES.forEach(c => {
            const div = document.createElement('div');
            div.className = 'leg-item';
            div.innerHTML = `<div class="leg-color" style="background:${c.color}"></div>${c.label}`;
            legendContainer.appendChild(div);
        });

        // ================================================================
        //  FUNÇÃO DE COR DOS PIXELS
        // ================================================================
        
        function getPixelColor(value) {
            const v = Math.round(value);
            if (!v || v === 0) return null;
            const c = CLASS_MAP[v];
            return c ? c.color : null;
        }

        // ================================================================
        //  MAPA (OpenLayers)
        // ================================================================
        
        let map = null;
        let rasterLayer = null;

        function criarMapa() {
            // Projeção Web Mercator (padrão)
            map = new ol.Map({
                target: 'map',
                layers: [
                    new ol.layer.Tile({
                        source: new ol.source.OSM({
                            attributions: '© OpenStreetMap'
                        })
                    })
                ],
                view: new ol.View({
                    center: ol.proj.fromLonLat([-47.93, -15.78]),
                    zoom: 5
                })
            });

            return map;
        }

        // ================================================================
        //  CARREGAR E EXIBIR GEOTIFF
        // ================================================================
        
        async function carregarGeoTIFF() {
            setLoading('📥 Baixando arquivo...', 'Conectando ao Dropbox...', 5);

            // Tenta primeiro com proxy (mais confiável para CORS)
            const urlsToTry = [PROXY_URL, DROPBOX_URL];
            let lastError = null;
            let arrayBuffer = null;

            for (let i = 0; i < urlsToTry.length; i++) {
                try {
                    const url = urlsToTry[i];
                    const isProxy = i === 0;
                    
                    setLoading(
                        isProxy ? '🔄 Usando proxy...' : '📥 Baixando do Dropbox...',
                        isProxy ? 'Servidor alternativo' : 'Arquivo ~100MB, aguarde...',
                        10 + (i * 20)
                    );

                    const response = await fetch(url, {
                        // Importante para alguns proxies
                        headers: {
                            'Accept': '*/*',
                            'Origin': window.location.origin
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    // Verifica se não é HTML (erro comum em proxies)
                    const contentType = response.headers.get('content-type') || '';
                    if (contentType.includes('text/html') && isProxy) {
                        throw new Error('Proxy retornou HTML em vez do arquivo');
                    }

                    // Lê como ArrayBuffer
                    arrayBuffer = await response.arrayBuffer();
                    
                    // Verifica se é um TIF válido (começa com "II" ou "MM")
                    const header = new Uint8Array(arrayBuffer.slice(0, 4));
                    const isValidTif = (
                        (header[0] === 0x49 && header[1] === 0x49) || // II
                        (header[0] === 0x4D && header[1] === 0x4D)    // MM
                    );
                    
                    if (!isValidTif) {
                        throw new Error('Arquivo não parece ser um GeoTIFF válido');
                    }

                    // Sucesso!
                    console.log('✅ Arquivo baixado:', (arrayBuffer.byteLength / 1024 / 1024).toFixed(1), 'MB');
                    break;

                } catch (error) {
                    lastError = error;
                    console.warn(`Tentativa ${i+1} falhou:`, error.message);
                    
                    if (i === urlsToTry.length - 1) {
                        showError(`
                            ❌ <strong>Erro ao baixar o arquivo</strong><br><br>
                            <strong>Mensagem:</strong> ${error.message}<br><br>
                            <strong>Soluções:</strong><br>
                            1. Verifique se o arquivo está público no Dropbox<br>
                            2. Tente recarregar a página<br>
                            3. Use um navegador diferente (Chrome ou Firefox)<br><br>
                            <span style="font-size:12px;color:#7a9bb3;">
                            Dica: Abra o console (F12) para mais detalhes.
                            </span>
                        `);
                        return;
                    }
                }
            }

            if (!arrayBuffer) {
                showError('❌ Não foi possível baixar o arquivo.');
                return;
            }

            setLoading('🔄 Processando GeoTIFF...', 'Lendo dados...', 65);

            try {
                // ============================================================
                //  LER O GEOTIFF COM GEOTIFF.JS
                // ============================================================
                
                const tiff = await GeoTIFF.fromBuffer(arrayBuffer);
                const image = await tiff.getImage();
                
                // Lê os dados da primeira banda
                const rasters = await image.readRasters({
                    interleave: false,
                    samples: [0] // Primeira banda
                });
                
                const data = rasters[0];
                const width = image.getWidth();
                const height = image.getHeight();
                
                console.log('📊 Dados do GeoTIFF:', {
                    width, height,
                    totalPixels: width * height,
                    min: Math.min(...data),
                    max: Math.max(...data)
                });

                // Obtém os bounds (coordenadas geográficas)
                const bbox = image.getBoundingBox();
                // bbox = [west, south, east, north] (em graus)

                setLoading('🎨 Renderizando no mapa...', 'Aplicando cores...', 80);

                // ============================================================
                //  CRIAR IMAGEM PARA O MAPA (OpenLayers)
                // ============================================================
                
                // Criar um canvas para desenhar o raster
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                const imageData = ctx.createImageData(width, height);
                
                // Preencher os pixels com as cores da legenda
                const pixels = imageData.data;
                let pixelCount = 0;
                
                for (let i = 0; i < data.length; i++) {
                    const value = data[i];
                    const color = getPixelColor(value);
                    
                    if (color) {
                        // Converte cor hex para RGB
                        const r = parseInt(color.slice(1, 3), 16);
                        const g = parseInt(color.slice(3, 5), 16);
                        const b = parseInt(color.slice(5, 7), 16);
                        
                        pixels[i * 4] = r;
                        pixels[i * 4 + 1] = g;
                        pixels[i * 4 + 2] = b;
                        pixels[i * 4 + 3] = 255;
                        pixelCount++;
                    } else {
                        // Transparente para NoData
                        pixels[i * 4] = 0;
                        pixels[i * 4 + 1] = 0;
                        pixels[i * 4 + 2] = 0;
                        pixels[i * 4 + 3] = 0;
                    }
                }
                
                console.log('🎨 Pixels renderizados:', pixelCount, 'de', data.length);
                
                ctx.putImageData(imageData, 0, 0);
                
                // Converte canvas para URL de imagem
                const imageUrl = canvas.toDataURL('image/png');

                // ============================================================
                //  ADICIONAR AO MAPA
                // ============================================================
                
                // Calcula a extensão em Web Mercator
                const extent = ol.proj.transformExtent(
                    [bbox[0], bbox[1], bbox[2], bbox[3]], // [west, south, east, north]
                    'EPSG:4326',
                    'EPSG:3857'
                );
                
                // Cria a camada de imagem
                const imageLayer = new ol.layer.Image({
                    source: new ol.source.ImageStatic({
                        url: imageUrl,
                        imageExtent: extent,
                        projection: 'EPSG:3857'
                    }),
                    opacity: 1
                });
                
                // Adiciona ao mapa
                map.addLayer(imageLayer);
                
                // Ajusta a visualização para a extensão do raster
                map.getView().fit(extent, {
                    padding: [50, 50, 50, 50],
                    duration: 500
                });

                setLoading('✅ Concluído!', 'Mapa pronto para uso.', 100);
                infoEl.textContent = `✅ ${(width * height / 1000000).toFixed(1)}M pixels`;

                setTimeout(() => {
                    hideLoading();
                    showNotif('✅ GeoTIFF carregado com sucesso!', 'ok');
                }, 800);

            } catch (error) {
                console.error('Erro ao processar GeoTIFF:', error);
                showError(`
                    ❌ <strong>Erro ao processar o GeoTIFF</strong><br><br>
                    <strong>Mensagem:</strong> ${error.message}<br><br>
                    <strong>Possíveis causas:</strong><br>
                    1. O arquivo não é um GeoTIFF válido<br>
                    2. O arquivo está corrompido<br>
                    3. Formato não suportado<br><br>
                    <span style="font-size:12px;color:#7a9bb3;">
                    Verifique se o arquivo é um GeoTIFF com uma única banda.
                    </span>
                `);
            }
        }

        // ================================================================
        //  INICIALIZAÇÃO
        // ================================================================
        
        function iniciar() {
            // Verifica se as bibliotecas carregaram
            if (typeof ol === 'undefined') {
                setTimeout(iniciar, 500);
                return;
            }
            
            if (typeof GeoTIFF === 'undefined') {
                setTimeout(iniciar, 500);
                return;
            }
            
            console.log('✅ Bibliotecas carregadas!');
            
            // Cria o mapa
            criarMapa();
            
            // Carrega o GeoTIFF
            carregarGeoTIFF();
        }

        // Aguarda o DOM carregar
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Iniciando OpenLayers...');
            setLoading('⏳ Inicializando...', 'Carregando bibliotecas...', 0);
            
            // Pequeno delay para garantir que os scripts carregaram
            setTimeout(iniciar, 1000);
        });

        // ================================================================
        //  FUNÇÕES DE CONTROLE (expor para o console)
        // ================================================================
        
        window.resetZoom = function() {
            if (map) {
                map.getView().setZoom(5);
                map.getView().setCenter(ol.proj.fromLonLat([-47.93, -15.78]));
            }
        };

        window.setOpacity = function(value) {
            if (map) {
                const layers = map.getLayers().getArray();
                const imageLayer = layers.find(l => l instanceof ol.layer.Image);
                if (imageLayer) {
                    imageLayer.setOpacity(value / 100);
                }
            }
        };

        console.log('💡 Funções disponíveis: resetZoom() e setOpacity(valor)');
    </script>
</body>
</html>
