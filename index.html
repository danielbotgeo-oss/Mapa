<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Teste Dropbox - GeoTIFF</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #0b141a; color: #fff; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        #status {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #111d29;
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid #1e3a4d;
            z-index: 9999;
            text-align: center;
            max-width: 90%;
        }
        #status.error { border-color: #e53935; color: #ff8a80; }
        #status.success { border-color: #2e7d5e; color: #7bcfa6; }
        .progress {
            width: 100%;
            height: 4px;
            background: #1a2e3b;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #58a9e8, #7bc0ff);
            transition: width 0.2s;
        }
    </style>
</head>
<body>
    <div id="status">
        <div id="msg">⏳ Inicializando...</div>
        <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/geotiff@2.0.7/dist/geotiff.bundle.min.js"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet@3.1.0/dist/georaster-layer-leaflet.min.js"></script>

    <script>
        // 🔑 SEU LINK DO DROPBOX (com dl=1)
        const DROPBOX_URL = 'https://www.dropbox.com/scl/fi/a62m3wxfw9tzhbvpabg05/UsoOcupacao_Sentinel2.tif?rlkey=nppxevja3hvad638og2byd6tq&dl=1';
        
        // Elementos
        const statusEl = document.getElementById('status');
        const msgEl = document.getElementById('msg');
        const progressBar = document.getElementById('progress-bar');

        function setStatus(msg, type) {
            msgEl.textContent = msg;
            statusEl.className = type || '';
        }

        function setProgress(pct) {
            progressBar.style.width = Math.min(100, pct) + '%';
        }

        // Mapa base
        const map = L.map('map').setView([-15.78, -47.93], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Função principal
        async function carregarTiff() {
            setStatus('📥 Baixando do Dropbox...', '');
            setProgress(5);

            try {
                // 1. Baixar o arquivo
                const response = await fetch(DROPBOX_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const contentLength = response.headers.get('content-length');
                const totalBytes = contentLength ? parseInt(contentLength) : 0;
                
                setStatus(`📥 Baixando ${totalBytes ? (totalBytes/1024/1024).toFixed(1) : '...'} MB`, '');

                // 2. Ler o stream com progresso
                const reader = response.body.getReader();
                const chunks = [];
                let received = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    chunks.push(value);
                    received += value.length;
                    
                    if (totalBytes > 0) {
                        const pct = 5 + (received / totalBytes) * 45;
                        setProgress(pct);
                    }
                }

                // 3. Juntar os chunks
                const allChunks = new Uint8Array(received);
                let position = 0;
                for (const chunk of chunks) {
                    allChunks.set(chunk, position);
                    position += chunk.length;
                }

                setStatus('🔄 Processando GeoTIFF...', '');
                setProgress(60);

                // 4. Interpretar com geotiff.js
                const tiff = await GeoTIFF.fromBuffer(allChunks.buffer);
                const image = await tiff.getImage();
                const bbox = image.getBoundingBox();
                
                setStatus('🎨 Renderizando no mapa...', '');
                setProgress(80);

                // 5. Criar layer com GeoRasterLayer
                const georaster = await parseGeoraster(allChunks.buffer);
                
                // Função de cores (simplificada - apenas para teste)
                function pixelColor(values) {
                    const v = Math.round(values[0]);
                    const colors = {
                        1: '#1b5e20', 2: '#66bb6a', 3: '#c5e1a5',
                        4: '#f9a825', 5: '#d4a44c', 6: '#e53935',
                        7: '#1565c0', 8: '#607d8b'
                    };
                    return colors[v] || null;
                }

                const layer = new GeoRasterLayer({
                    georaster: georaster,
                    pixelValuesToColorFn: pixelColor,
                    resolution: 256,
                    opacity: 1
                });

                layer.addTo(map);
                
                // Ajustar zoom
                map.fitBounds(layer.getBounds());

                setStatus('✅ Sucesso! GeoTIFF carregado.', 'success');
                setProgress(100);

                // Mostrar info no console
                console.log('GeoTIFF carregado:', {
                    width: georaster.width,
                    height: georaster.height,
                    bands: georaster.numberOfRasters,
                    bbox: bbox
                });

            } catch (error) {
                console.error('Erro completo:', error);
                setStatus(`❌ Erro: ${error.message}`, 'error');
                setProgress(0);
            }
        }

        // Iniciar quando as bibliotecas carregarem
        function iniciar() {
            if (typeof GeoTIFF !== 'undefined' && typeof parseGeoraster !== 'undefined') {
                carregarTiff();
            } else {
                setTimeout(iniciar, 500);
            }
        }

        iniciar();
    </script>
</body>
</html>
